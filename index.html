<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Viewer</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Mona+Sans:ital,wght@0,200..900;1,200..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Sansation:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="main-page">
        <header class="name-header">
            <span>GitHub Profile Viewer</span>
            <span>Made & designed by <a href="https://github.com/naokimon" target="_blank">naokimon</a></span>
        </header>

        <form id="search-form" class="search-form">
            <div>
                <label for="search">&#x1F50E;&#xFE0E;</label>
                <input id="search" name="search" type="text" class="search-input" placeholder="Search for users...">
            </div>
            <input type="submit" value="Search" class="search-submit">
        </form>

        <footer class="footer">
            <span>
                &copy; 2026 Nathan Cruz Martinez
            </span>
        </footer>
    </main>

    <script src="scripts/redirect.js"></script>
</body>
</html>
